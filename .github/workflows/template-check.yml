name: Template check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.0
      - name: Materialize and check declared generators
        env:
          RUST_FIXTURE_ROOT: ${{ runner.temp }}/rust-generated
        run: cd checks && go test -count=1 ./...
      - name: Install pinned cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 "$url" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/cargo-deny"
          test "$("$RUNNER_TEMP/cargo-deny/cargo-deny" --version)" = "cargo-deny ${CARGO_DENY_VERSION}"
      - id: template
        uses: tplAIter/tplaiter/.github/actions/template-check@12cf8f810faa25f8c573dcc22fbebb45b1c4db8c
      - name: Check every rendered Rust fixture
        env:
          RENDER_ROOT: ${{ steps.template.outputs.render-root }}
        run: |
          set -euo pipefail
          for project in "$RENDER_ROOT"/*; do
            (cd "$project" && cargo test --all-targets --locked)
            (cd "$project" && cargo check --all-targets --locked)
          done
      - name: Audit bounded Rust entity fixture and release profile
        env:
          RUST_FIXTURE_ROOT: ${{ runner.temp }}/rust-generated
        run: |
          set -euo pipefail
          project="$RUST_FIXTURE_ROOT/postgres-per_entity"
          test -f "$project/Cargo.toml"
          "$RUNNER_TEMP/cargo-deny/cargo-deny" --manifest-path "$project/Cargo.toml" --config "$project/deny.toml" --locked check advisories licenses sources
          cargo build --release --offline --locked --manifest-path "$project/Cargo.toml"
      - name: Check generated CRUD bridges and all five generators
        run: |
          set -euo pipefail
          for project in "$RUNNER_TEMP/rust-generated"/*; do
            (cd "$project" && cargo test --all-targets --locked)
            (cd "$project" && cargo check --all-targets --locked)
          done
